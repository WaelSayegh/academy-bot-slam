# localization_params.yaml
# slam_toolbox in LOCALIZATION mode — loads a previously-saved serialized map
# and tracks the robot in it (no new mapping). Used in Session 4 when we run the
# full autonomous stack on a known map. Set `map_file_name` to your saved map
# (without the .posegraph / .data extension), e.g. from acadbot_navigation/maps.
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: localization

    # Path to the serialized map produced by `slam_toolbox` "Serialize Map".
    map_file_name: /ros2_ws/src/acadbot_navigation/maps/academy_map_v2_serial
    map_start_at_dock: true

    resolution: 0.05
    max_laser_range: 12.0
    transform_publish_period: 0.02
    transform_timeout: 0.2
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
