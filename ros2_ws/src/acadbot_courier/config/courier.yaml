courier_server:
  ros__parameters:
    use_sim_time: true
    frame_id: "map"
    mission_mode: "bt"       # "bt" = behavior-tree, "loop" = hand-written loop
    retry_count: 5
    retry_delay_sec: 2.0
    feedback_period_sec: 1.0
    leg_timeout_sec: 120.0
    busy_reject: true
    location_names: ["reception", "lab_bench"]
    location_poses: [0.6, 4.2, 0.0, 5.5, 0.6, 0.0]  # x, y, yaw per name